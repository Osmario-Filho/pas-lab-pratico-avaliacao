spring.application.name=estoque-service
server.port=8080

# Banco exclusivo do Estoque Service (estoque-db).
# No Docker Compose estes valores são sobrescritos por SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque
spring.datasource.username=estoque
spring.datasource.password=estoque

# A tabela é criada pelo schema.sql e populada pelo data.sql (modelo de dados do roteiro);
# o Hibernate não gera DDL.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
