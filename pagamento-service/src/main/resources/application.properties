spring.application.name=pagamento-service
server.port=8080

# Banco exclusivo do Pagamento Service (pagamento-db).
# No Docker Compose estes valores são sobrescritos por SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/pagamento
spring.datasource.username=pagamento
spring.datasource.password=pagamento

# A tabela é criada pelo schema.sql (modelo de dados do roteiro); o Hibernate não gera DDL.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# RabbitMQ. No Docker Compose o host vem de SPRING_RABBITMQ_HOST=rabbitmq.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# Uma mensagem por vez por consumidor: com várias instâncias (--scale) o trabalho se divide
# de fato, em vez de uma instância pré-carregar todas as mensagens.
spring.rabbitmq.listener.simple.prefetch=1

# ~80% de aprovação, como no roteiro. pagamento.atraso-ms simula tempo de processamento.
pagamento.taxa-aprovacao=${PAGAMENTO_TAXA_APROVACAO:0.8}
pagamento.atraso-ms=${PAGAMENTO_ATRASO_MS:0}
