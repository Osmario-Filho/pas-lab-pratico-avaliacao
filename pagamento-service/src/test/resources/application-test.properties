# Nos testes o PostgreSQL é substituído por um H2 em memória, com o mesmo schema.sql.
spring.datasource.url=jdbc:h2:mem:pagamento;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Sem RabbitMQ nos testes: o listener não inicia e o RabbitTemplate é substituído por mock.
spring.rabbitmq.listener.simple.auto-startup=false
