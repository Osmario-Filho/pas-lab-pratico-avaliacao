spring.application.name=pedido-service
server.port=8080

# Banco exclusivo do Pedido Service (pedido-db).
# No Docker Compose estes valores são sobrescritos por SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/pedido
spring.datasource.username=pedido
spring.datasource.password=pedido

# A tabela é criada pelo schema.sql (modelo de dados do roteiro); o Hibernate não gera DDL.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Estoque Service (REST). No Docker Compose: ESTOQUE_SERVICE_URL=http://estoque-service:8080
estoque.service.url=${ESTOQUE_SERVICE_URL:http://localhost:8081}

# RabbitMQ. No Docker Compose o host vem de SPRING_RABBITMQ_HOST=rabbitmq.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# Uma mensagem por vez por consumidor (distribuição justa entre instâncias).
spring.rabbitmq.listener.simple.prefetch=1

# Experimento de consistência (Etapa 3): falha injetada entre reservar o estoque e criar o pedido,
# e liberação (compensação) da reserva quando o pedido não pôde ser criado.
pedido.simular-falha-apos-reserva=${PEDIDO_SIMULAR_FALHA_APOS_RESERVA:false}
pedido.compensacao.habilitada=${PEDIDO_COMPENSACAO_HABILITADA:true}
