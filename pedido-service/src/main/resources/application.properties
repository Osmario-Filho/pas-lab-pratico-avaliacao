spring.application.name=pedido-service
server.port=8080

# Banco exclusivo do Pedido Service (pedido-db).
# No Docker Compose estes valores são sobrescritos por SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/pedido
spring.datasource.username=pedido
spring.datasource.password=pedido

# A tabela é criada pelo schema.sql (modelo de dados do roteiro); o Hibernate não gera DDL.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
